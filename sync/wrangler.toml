name = "julian-sync"
main = "src/index.ts"
compatibility_date = "2026-07-01"

[[durable_objects.bindings]]
name = "JULIAN_SYNC"
class_name = "JulianSyncDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["JulianSyncDO"]

# No OIDC vars: sync verifies nothing locally. A legacy Pocket ID JWT is just
# a token to sync now, handed to the gate's /introspect JWT arm like any other
# credential — one authority, and one place the sunset lands (spec §6.5).
# INTROSPECT_SECRET is a worker secret (wrangler secret put) — never a var, never in this file.

# Sync reaches the gate in-process; same-account workers.dev fetches do not
# route (issue #28) — the binding is the only road.
[[services]]
binding = "GATE"
service = "julian-broker"

[assets]
directory = "./public"

[vars]
# CSV of door names allowed to POST /restore — the migration door only.
# Door-name gating, not subject: a device lease carries no subject on the
# wire (see the plan's wire-truth correction). Fail-closed when unset.
# Both spellings of the one door: the gate canonicalizes names with a
# `door:` prefix at approval (as/approve.ts), so the introspection wire
# carries `door:mac-home` — found live at R9 when the bare form 403'd.
RESTORE_DOORS = "mac-home,door:mac-home"

[[routes]]
pattern = "sync.julian.soul.store"
custom_domain = true
