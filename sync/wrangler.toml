name = "julian-sync"
main = "src/index.ts"
compatibility_date = "2026-07-01"

[[durable_objects.bindings]]
name = "JULIAN_SYNC"
class_name = "JulianSyncDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["JulianSyncDO"]

[vars]
OIDC_ISSUER = "https://souls.exe.xyz"
OIDC_JWKS_URL = "https://souls.exe.xyz/.well-known/jwks.json"
OIDC_AUDIENCE = "0143f667-3c75-4779-b16c-e2709ffdc049"   # Pocket ID client_id for the Julian app
# INTROSPECT_SECRET is a worker secret (wrangler secret put) — never a var, never in this file.

# Sync reaches the gate in-process; same-account workers.dev fetches do not
# route (issue #28) — the binding is the only road.
[[services]]
binding = "GATE"
service = "julian-broker"

[assets]
directory = "./public"
