name = "julian-broker"
main = "src/index.ts"
compatibility_date = "2026-07-01"

[[durable_objects.bindings]]
name = "GOVERNOR"
class_name = "GovernorDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GovernorDO"]

[vars]
OIDC_ISSUER = "https://souls.exe.xyz"
OIDC_JWKS_URL = "https://souls.exe.xyz/.well-known/jwks.json"
OIDC_AUDIENCE = "0143f667-3c75-4779-b16c-e2709ffdc049"   # Pocket ID client_id for the Julian app
AGENTMAIL_INBOX_ID = "julian-marcus@agentmail.to"        # public address, not a secret

# The gate's own face. These are placeholders so `wrangler dev` and the test
# runtime have the right shape; the real values are set at deploy.
APPROVER_SUBS = "94d31ef6-0b1f-441e-b67c-c037a8993924"                                       # comma-separated Pocket ID subs; empty refuses every approval
GATE_CLIENT_ID = "79ff255e-dd77-4ade-adc8-db4fd833f361"                         # Pocket ID client for the approval login
GATE_REDIRECT_URI = "https://julian-broker.julian-memory.workers.dev/auth/callback"
PUBLIC_URL = "https://julian-broker.julian-memory.workers.dev"
LEGACY_WINDOW_END = "2026-08-23T00:00:00Z"               # after this, Pocket ID bearers are refused

# Worker secrets (wrangler secret put) — never vars, never in this file:
#   AGENTMAIL_API_KEY, SESSION_SECRET, INTROSPECT_SECRET, BREAKGLASS_SECRET
