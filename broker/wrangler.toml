name = "julian-broker"
account_id = "e33948793047032de7f5e18ec342a7d1"   # personal account since the soul.store migration (R1, 2026-08-27); wrangler had cached the corporate id
main = "src/index.ts"
compatibility_date = "2026-07-01"

[[durable_objects.bindings]]
name = "GOVERNOR"
class_name = "GovernorDO"

[[durable_objects.bindings]]
name = "REGISTRAR"
class_name = "RegistrarDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GovernorDO"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["RegistrarDO"]

[[kv_namespaces]]
binding = "PIN"
id = "916b2465336448e6b1dea3183f430cb8"   # created 2026-08-27 (soul.store migration R2, personal account); vitest/miniflare ignore ids

[vars]
OIDC_ISSUER = "https://souls.exe.xyz"
OIDC_JWKS_URL = "https://souls.exe.xyz/.well-known/jwks.json"
OIDC_AUDIENCE = "0143f667-3c75-4779-b16c-e2709ffdc049"   # Pocket ID client_id for the Julian app
AGENTMAIL_INBOX_ID = "julian-marcus@agentmail.to"        # public address, not a secret
MCP_RESOURCE_URL = "https://gate.julian.soul.store/mcp"
PACKAGE_RAW_BASE = "https://raw.githubusercontent.com/popmechanic/Julian"
PIN_COMPARE_BASE = "https://api.github.com/repos/popmechanic/Julian/compare/main..."

# The gate's own face. These are placeholders so `wrangler dev` and the test
# runtime have the right shape; the real values are set at deploy.
APPROVER_SUBS = "94d31ef6-0b1f-441e-b67c-c037a8993924"                                       # comma-separated Pocket ID subs; empty refuses every approval
GATE_CLIENT_ID = "79ff255e-dd77-4ade-adc8-db4fd833f361"                         # Pocket ID client for the approval login
GATE_REDIRECT_URI = "https://gate.julian.soul.store/auth/callback"
PUBLIC_URL = "https://gate.julian.soul.store"

STREAM_SUBS = "94d31ef6-0b1f-441e-b67c-c037a8993924=julian"                     # sub=principal comma-separated map
APP_ORIGINS = "https://julian.exe.xyz,https://julian-new.exe.xyz,http://localhost:8000"  # comma-separated exact origins

[[services]]
binding = "SYNC"
service = "julian-sync"

[[unsafe.bindings]]
name = "EXCHANGE_RL"
type = "ratelimit"
namespace_id = "1101"
simple = { limit = 30, period = 60 }

# Worker secrets (wrangler secret put) — never vars, never in this file:
#   AGENTMAIL_API_KEY, SESSION_SECRET, INTROSPECT_SECRET, BREAKGLASS_SECRET, SYNC_READ_SECRET

# Custom domain (soul.store migration) — Cloudflare creates the DNS record and
# an exact-hostname certificate at deploy; the zone must be active on the
# deploying account. The PIN kv id ABOVE ([[kv_namespaces]], top of file) is
# replaced by the runbook when the personal-account namespace is created
# (Runbook step R2). EXCHANGE_RL's namespace_id needs no re-pointing: ratelimit
# bindings are declarative — the id is an account-local integer partitioning
# limiter state, not a provisioned resource.
[[routes]]
pattern = "gate.julian.soul.store"
custom_domain = true
